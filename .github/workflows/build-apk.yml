name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Generate Flutter platform folders
        run: flutter create --project-name adreemk_expiry .

      - name: Apply owner licensing wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/main.dart")
          s = p.read_text()
          s = s.replace(
              "if(v=='116936'&&mounted)Navigator.push(context,MaterialPageRoute(builder:(_)=>const Admin()));",
              "if(v!=null&&mounted)Navigator.push(context,MaterialPageRoute(builder:(_)=>Admin(ownerPin:v)));"
          )
          s = s.replace(
              "class Admin extends StatefulWidget {\n  const Admin({super.key});",
              "class Admin extends StatefulWidget {\n  final String ownerPin;\n  const Admin({super.key, required this.ownerPin});"
          )
          s = s.replace(
              "customerName: customer.text,\n        plan: plan,",
              "adminApiKey: widget.ownerPin,\n        customerName: customer.text,\n        plan: plan,"
          )
          p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: adreemk-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
